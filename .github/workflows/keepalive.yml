# Keeps the backend Space awake: free Hugging Face Spaces sleep after ~48h
# without traffic, and the first visitor afterwards waits minutes for a cold start.
# Set the BACKEND_URL variable (e.g. https://<user>-tipe-backend.hf.space) under
# Settings -> Secrets and variables -> Actions -> Variables.
name: Backend keep-alive

on:
  schedule:
    - cron: "41 6 * * *"   # once a day
  workflow_dispatch:

concurrency:
  group: backend-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping /health until the Space answers
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Set the BACKEND_URL repository variable first."
            exit 1
          fi
          url="${BACKEND_URL%/}/health"
          # A sleeping Space returns a "starting" page (or 503) while it boots,
          # so keep asking for up to ~10 minutes until /health returns status ok.
          for i in $(seq 1 40); do
            body=$(curl -s -m 30 "$url" || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Backend awake after $i attempt(s): $body"
              exit 0
            fi
            echo "Attempt $i: not ready yet"
            sleep 15
          done
          echo "::error::Backend did not answer at $url"
          exit 1
